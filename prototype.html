<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionShift 4K - Design Prototype</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        accent: '#EAB308', // Yellow-500
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #0A0A0A;
            --card-bg: #141414;
            --border: rgba(255, 255, 255, 0.08);
            --text: #F5F5F5;
            --text-dim: rgba(245, 245, 245, 0.4);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        .glass {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
        }

        .swiss-border {
            border: 1px solid var(--border);
        }

        .mono-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 700;
        }
    </style>
</head>
<body class="selection:bg-accent selection:text-black">

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass h-16 flex items-center px-6 justify-between">
        <div class="flex items-center gap-4">
            <div class="w-8 h-8 bg-accent rounded-lg flex items-center justify-center text-black font-bold">VS</div>
            <h1 class="text-xs font-bold uppercase tracking-[0.3em]">VisionShift <span class="opacity-50">4K</span></h1>
        </div>
        
        <div class="flex items-center gap-6">
            <span class="mono-label opacity-40">System: Ready</span>
            <button class="px-4 py-2 bg-white text-black text-[10px] font-bold uppercase tracking-widest rounded-xl hover:scale-105 transition-transform">
                New Generation
            </button>
        </div>
    </nav>

    <!-- Sidebar Overlay (Simplified) -->
    <aside class="fixed left-0 top-16 bottom-0 w-16 border-r border-white/5 flex flex-col items-center py-8 gap-8 hidden md:flex">
        <div class="w-2 h-2 rounded-full bg-accent"></div>
        <div class="w-2 h-2 rounded-full bg-white/10"></div>
        <div class="w-2 h-2 rounded-full bg-white/10"></div>
        <div class="w-2 h-2 rounded-full bg-white/10"></div>
    </aside>

    <main class="md:ml-16 pt-32 px-6 max-w-7xl mx-auto">
        <!-- Hero Section -->
        <section class="mb-24">
            <div class="flex flex-col gap-2 mb-12">
                <span class="mono-label text-accent">Process Engine 0.1</span>
                <h2 class="text-5xl md:text-7xl font-bold tracking-tighter leading-none max-w-3xl">
                    Transforming <br/> Visual Realities.
                </h2>
            </div>

            <!-- Upload Box Prototype -->
            <div class="w-full glass rounded-3xl p-12 flex flex-col items-center justify-center border-dashed border-2 border-white/10 group cursor-pointer hover:border-accent/40 transition-colors">
                <div class="w-16 h-16 rounded-full bg-white/5 flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-accent"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </div>
                <p class="text-sm font-medium mb-2 uppercase tracking-widest">Select Image Asset</p>
                <p class="mono-label opacity-40">Drag and drop or click to browse</p>
            </div>
        </section>

        <!-- Generation History Prototype -->
        <section class="mb-32">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-accent"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <h3 class="mono-label opacity-40">Recent Visuals</h3>
                </div>
                <div class="h-[1px] flex-grow mx-8 bg-white/5"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Example Card 1 -->
                <div class="aspect-square glass rounded-2xl overflow-hidden group relative">
                    <div class="absolute inset-0 bg-neutral-900 flex items-center justify-center">
                        <span class="mono-label opacity-20">Sample Asset 01</span>
                    </div>
                </div>
                <!-- Example Card 2 -->
                <div class="aspect-square glass rounded-2xl overflow-hidden group relative">
                    <div class="absolute inset-0 bg-neutral-900 flex items-center justify-center">
                        <span class="mono-label opacity-20">Sample Asset 02</span>
                    </div>
                </div>
                <!-- Example Card 3 -->
                <div class="aspect-square glass rounded-2xl overflow-hidden group relative">
                    <div class="absolute inset-0 bg-neutral-900 flex items-center justify-center">
                        <span class="mono-label opacity-20">Sample Asset 03</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Stats -->
    <footer class="md:ml-16 border-t border-white/5 py-12 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-8">
            <div class="flex gap-12">
                <div>
                    <p class="mono-label mb-2">Uptime</p>
                    <p class="text-2xl font-bold font-mono tracking-tighter">99.9%</p>
                </div>
                <div>
                    <p class="mono-label mb-2">Resolution</p>
                    <p class="text-2xl font-bold font-mono tracking-tighter">4K RAW</p>
                </div>
            </div>
            <div class="text-right">
                <p class="mono-label opacity-20">Prototype v1.0.0</p>
                <p class="text-[10px] opacity-10">© 2024 VISIONSHIFT ENGINE</p>
            </div>
        </div>
    </footer>

</body>
</html>
